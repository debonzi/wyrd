[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[project]
name = "wyrd-cli"
version = "0.1.0"
description = "A local ticket management CLI for coding agents and humans"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wyrd contributors" }]
keywords = [
    "cli",
    "coding-agents",
    "issue-tracker",
    "project-management",
    "ticket-management",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
    "rich>=14.0,<15",
    "typer>=0.21,<1",
]

[project.urls]
Homepage = "https://github.com/debonzi/wyrd"
Repository = "https://github.com/debonzi/wyrd"
Issues = "https://github.com/debonzi/wyrd/issues"
Changelog = "https://github.com/debonzi/wyrd/blob/main/CHANGELOG.md"

[project.scripts]
wyrd = "wyrd_cli.main:main"

[dependency-groups]
dev = ["pytest>=9.0,<10"]
release = ["twine==6.2.0"]

[tool.uv]
required-version = "==0.12.3"

[tool.uv.build-backend]
source-exclude = [
    "/.drafts",
    "/.git",
    "/.pytest_cache",
    "/.venv",
    "/dist",
    "/skills",
    "/tests",
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
